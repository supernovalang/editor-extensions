# rust-toolchain.toml
# Força o toolchain GNU no Windows para evitar erro de compilação:
#   LINK fatal error LNK1104 — msvcrt.lib not found
#
# O Zed compila a extensão internamente via `cargo build`. Com o toolchain
# MSVC padrão, build scripts falham por falta do Windows SDK (msvcrt.lib).
# O toolchain GNU não precisa do Windows SDK e funciona sem instalação adicional.

[toolchain]
channel = "stable-x86_64-pc-windows-gnu"
targets = ["wasm32-wasip1"]
components = ["rustfmt", "clippy"]
profile = "minimal"
